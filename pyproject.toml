[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyrestore"
version = "0.1.1"
description = "Guided iPhone and iPad restore for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "EasyRestore" }]
dependencies = [
    "PySide6_Essentials>=6.6.0",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
easyrestore = "easyrestore.app:main"
easyrestore-helper = "easyrestore.helper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyrestore = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
